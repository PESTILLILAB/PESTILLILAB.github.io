# Team roster. Edit this file to add or remove people; the Team page is built from it.
# Each person: name, position, image (in /assets/img/people/), description (optional, used for alumni),
# and any of github, scholar, linkedin, twitter, cv. Omit image to show initials instead.
# Move an entry between the team, collaborators and alumni lists to change where it appears.
# The PI bio is Markdown: blank lines make paragraphs, **bold**, [links](url).
# Group photo shown at the top of the Team page. Remove the block (or comment it out) to hide it.
