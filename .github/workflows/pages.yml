# Builds the Jekyll site and publishes it to GitHub Pages on every push to main.
# Once a week (and on manual runs) it first refreshes _data/stats.json for the Impact page.
# Nothing to configure: the repository's Pages source is "GitHub Actions".
name: Deploy site

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: refresh the statistics, then rebuild
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  stats:
    # Weekly numbers for the Impact page (GitHub, OpenAlex, PubMed). Skipped on ordinary pushes.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/stats/fetch_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/stats.json
          git diff --cached --quiet || git commit -m "Weekly statistics update"
          git push

  build:
    needs: stats
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    # runs after any successful build (the stats job above may legitimately be skipped)
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
