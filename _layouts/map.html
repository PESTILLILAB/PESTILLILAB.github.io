---
layout: default
---
    {% include page-head.html content=content %}

    <section class="tight-top">
      <div class="wrap">
        <div class="grid grid-2 tiers">
          <div class="tier reveal" id="tier-owned">
            <p class="eyebrow">{{ page.owned_title }}</p>
            <div class="stats stats-3" data-tier="owned"></div>
            <p class="small muted">{{ page.owned_text }}</p>
          </div>
          <div class="tier reveal" id="tier-derived">
            <p class="eyebrow">{{ page.derived_title }}</p>
            <div class="stats stats-3" data-tier="derived"></div>
            <p class="small muted">{{ page.derived_text }}</p>
          </div>
        </div>
        <div class="grid grid-3 charts reveal">
          <figure class="chart"><figcaption>Papers per year <span class="src">PubMed</span></figcaption><div data-chart="papers"></div></figure>
          <figure class="chart"><figcaption>Citations per year <span class="src">OpenAlex</span></figcaption><div data-chart="citations"></div><p class="legend"><i class="k k-owned"></i>lab-owned <i class="k k-derived"></i>lab-derived</p></figure>
          <figure class="chart"><figcaption>Repositories, stars and forks by account <span class="src">GitHub</span></figcaption><div data-chart="github"></div></figure>
        </div>
        <p class="small muted" id="stats-updated"></p>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head reveal">
          <p class="eyebrow">{{ page.graph_title }}</p>
          <p class="lede">{{ page.graph_text }}</p>
        </div>
        <div class="map-tools">
          <label class="sr-only" for="map-search">Find a node</label>
          <input id="map-search" type="search" placeholder="Find a person, paper, tool…" autocomplete="off">
          <div class="map-filters" id="map-filters"></div>
        </div>
        <div class="map-wrap">
          <canvas id="map" aria-label="Graph of the lab's areas, projects, software, people and papers"></canvas>
          <aside class="map-panel" id="map-panel"><p class="muted">Click a node.</p></aside>
        </div>
        <noscript><p>The map needs JavaScript. The same information is on the Research, Projects, Code &amp; Data, Team and Publications pages.</p></noscript>
      </div>
    </section>
