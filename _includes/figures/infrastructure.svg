              <text x="30" y="282" font-family="Geist, sans-serif" font-size="10.5" fill="#a9bac6">provenance follows knowledge as it changes form:</text>
              <text x="30" y="298" font-family="Geist, sans-serif" font-size="10.5" fill="#a9bac6">data → results → models → agent actions → claims</text>
